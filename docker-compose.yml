name: task-distribution

services:
  api:
    build:
      context: .
      dockerfile: src/TaskDistribution.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5080:8080"
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
